<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTA Insight — Relatório Unificado das Pós-Graduações</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#162032; --border:#2a3a52;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#f97316;
    --green:#22c55e; --yellow:#eab308; --red:#ef4444; --blue:#3b82f6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0f172a 85%,transparent);
         padding:18px 24px 10px;border-bottom:1px solid var(--border);}
  header h1{margin:0 0 2px;font-size:20px;}
  header .sub{color:var(--muted);font-size:13px;}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
  nav button{background:var(--card);border:1px solid var(--border);color:var(--text);
             padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;}
  nav button:hover{border-color:var(--accent);}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#0f172a;font-weight:600;}
  main{padding:22px 24px 60px;max-width:1400px;margin:0 auto;}
  section{display:none;}
  section.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  h2{font-size:17px;margin:0 0 4px;}
  h3{font-size:14px;color:var(--muted);margin:26px 0 10px;text-transform:uppercase;letter-spacing:.04em;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:6px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .card .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .card .value{font-size:24px;font-weight:700;}
  .card .delta{font-size:12px;margin-top:4px;}
  .up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--muted);}
  .panel{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
  .two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;}
  @media(max-width:900px){.two-col{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;}
  tr:hover td{background:#1a2740;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.alto{background:#4c1d1d;color:#fca5a5;}
  .badge.medio{background:#4a3a12;color:#fde68a;}
  .badge.baixo{background:#123b25;color:#86efac;}
  .badge.pendente{background:#4a3a12;color:#fde68a;}
  .badge.aceito{background:#123b25;color:#86efac;}
  ul.insight-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  ul.insight-list li{background:var(--card2);border-left:3px solid var(--accent);border-radius:6px;
                      padding:10px 12px;font-size:13.5px;line-height:1.5;}
  ul.insight-list.riscos li{border-left-color:var(--red);}
  ul.insight-list.positivos li{border-left-color:var(--green);}
  .cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:1000px){.cols3{grid-template-columns:1fr;}}
  .course-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .course-tabs button{padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card);
                       color:var(--text);font-size:12.5px;cursor:pointer;}
  .course-tabs button.active{color:#0b1220;font-weight:700;border-color:transparent;}
  .week-toggle{display:flex;gap:6px;margin-bottom:16px;}
  .week-toggle button{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);
                       color:var(--text);font-size:12.5px;cursor:pointer;}
  .week-toggle button.active{background:var(--accent);border-color:var(--accent);color:#0f172a;font-weight:700;}
  .chart-box{position:relative;height:260px;}
  .quote{font-size:12.5px;color:var(--muted);border-left:2px solid var(--border);padding-left:10px;margin:8px 0;}
  .quote b{color:var(--text);}
  .note{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .footer-note{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:20px;
        padding:3px 10px;font-size:11.5px;color:var(--muted);margin-right:6px;}
  .scroll-x{overflow-x:auto;}
  .exec-num{font-weight:700;color:var(--accent);}
  ol.exec-list{padding-left:20px;line-height:1.8;font-size:14px;}
  .action-prio-Alta{color:var(--red);font-weight:700;}
  .action-prio-Média{color:var(--yellow);font-weight:700;}
  .action-prio-Baixa{color:var(--green);font-weight:700;}
</style>
</head>

const TABS = [
  {id:'resumo', label:'1. Resumo Executivo'},
  {id:'indicadores', label:'2. Indicadores Gerais'},
  {id:'cursos', label:'3. Por Pós-Graduação'},

  {id:'conclusao', label:'8. Conclusão'},
];

let currentWeek = 'w3'; // semana mais recente por padrao

const charts = {};

function fmt(n){ return n===null||n===undefined ? 'Dados não disponíveis' : (typeof n==='number' ? n.toLocaleString('pt-BR') : n); }
function pct(n){ return n===null||n===undefined ? 'Dados não disponíveis' : n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
function courseByKey(k){ return DATA.cursos.find(c=>c.key===k); }
function weekLabel(k){ return DATA.semanas[parseInt(k.slice(1),10)-1]; }
function prevWeekKey(k){ const i = parseInt(k.slice(1),10); return i>1 ? 'w'+(i-1) : null; }
function latestWeekKey(){ return 'w'+DATA.semanas.length; }
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

function deltaTag(cur, prev, invert){
  if(cur===null||prev===null||cur===undefined||prev===undefined) return '<span class="delta flat">—</span>';
  const d = +(cur-prev).toFixed(2);
  let cls = 'flat', arrow='—';
  if(d>0){ cls = invert ? 'down' : 'up'; arrow='▲'; }
  else if(d<0){ cls = invert ? 'up' : 'down'; arrow='▼'; }
  return `<span class="delta ${cls}">${arrow} ${d>0?'+':''}${d} vs. semana anterior</span>`;
}

// ---------- NAV ----------
function buildNav(){
  const nav = document.getElementById('mainNav');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" id="nav-${t.id}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>showTab(b.dataset.tab)));
}
function showTab(id){
  TABS.forEach(t=>{
    document.getElementById('sec-'+t.id).classList.toggle('active', t.id===id);
    document.getElementById('nav-'+t.id).classList.toggle('active', t.id===id);
  });
  if(id==='resumo') renderResumo();
  if(id==='indicadores') renderIndicadores();
  if(id==='cursos') renderCursos();
  if(id==='comparativo') renderComparativo();
  if(id==='cs') renderCS();
  if(id==='insights') renderInsights();
  if(id==='plano') renderPlano();
  if(id==='conclusao') renderConclusao();
}

// ---------- 4. COMPARATIVO SEMANAL ----------
function renderComparativo(){
  const el = document.getElementById('sec-comparativo');
  const wKeys = DATA.semanas.map((s,i)=>'w'+(i+1));
  const arrow = (vals, fmtFn) => vals.map((v,i)=> i===vals.length-1 ? `<b>${fmtFn(v)}</b>` : fmtFn(v)).join(' → ');
  const idFmt = v=>v, pctFmtLocal = v=>pct(v);
  el.innerHTML = `
    <h2>Comparativo Semanal — ${DATA.semanas.join(' → ')}</h2>
    <div class="note">Evolução das 5 pós-graduações nas ${DATA.semanas.length} semanas monitoradas até o momento.</div>
    <div class="scroll-x">
    <table style="margin-top:14px;">
      <thead><tr><th>Curso</th><th>Ativos</th><th>Cancelados</th><th>Taxa cancel.</th><th>Contrato pendente</th><th>CSAT</th><th>Consumo médio</th><th>Alunos em risco</th></tr></thead>
      <tbody>
        ${DATA.cursos.map(c=>{
          const ws = wKeys.map(k=>c.semanas[k]);
          return `<tr>
            <td style="font-weight:600;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:6px;"></span>${c.name}</td>
            <td>${arrow(ws.map(w=>w.base.ativos), idFmt)}</td>
            <td>${arrow(ws.map(w=>w.base.cancelados), idFmt)}</td>
            <td>${arrow(ws.map(w=>w.base.taxa_cancelamento), pctFmtLocal)}</td>
            <td>${arrow(ws.map(w=>w.base.contrato_pendente), idFmt)}</td>
            <td>${arrow(ws.map(w=>w.csat.csat_curso), idFmt)}</td>
            <td>${arrow(ws.map(w=>w.desempenho.consumo_medio), pctFmtLocal)}</td>
            <td>${arrow(ws.map(w=>w.n_risco), idFmt)}</td>
          </tr>`;
        }).join('')}
        <tr style="background:#16233a;font-weight:700;">
          <td>TOTAL / MÉDIA GERAL</td>
          <td>${arrow(wKeys.map(k=>DATA.geral[k].ativos), idFmt)}</td>
          <td>${arrow(wKeys.map(k=>DATA.geral[k].cancelados), idFmt)}</td>
          <td>${arrow(wKeys.map(k=>DATA.geral[k].taxa_evasao_geral), pctFmtLocal)}</td>
          <td>${arrow(wKeys.map(k=>DATA.geral[k].contrato_pendente), idFmt)}</td>
          <td>${arrow(wKeys.map(k=>DATA.geral[k].csat_medio_geral), idFmt)}</td>
          <td>—</td>
          <td>${arrow(wKeys.map(k=>DATA.alunos_risco_total[k]), idFmt)}</td>
        </tr>
      </tbody>
    </table>
    </div>

    <div class="two-col" style="margin-top:22px;">
      <div class="panel"><h3 style="margin-top:0;">Evolução de ativos por curso</h3><div class="chart-box"><canvas id="chartEvolAtivos"></canvas></div></div>
      <div class="panel"><h3 style="margin-top:0;">Evolução de CSAT por curso</h3><div class="chart-box"><canvas id="chartEvolCsat"></canvas></div></div>
    </div>

    <h3>Tendências observadas</h3>
    <div class="panel">
      <ul class="insight-list positivos">
        <li>Cancelamentos: voltaram a crescer na semana — 2 novos casos líquidos (88 → 90), em IA Aplicada a Negócios e MBA Direito, após leitura anterior estável.</li>
        <li>Engajamento (consumo de conteúdo): em alta em Engenharia de Dados e Azure (+0,9pp e +0,4pp); em queda em IA Negócios e MBA Direito (-1,2pp e -0,5pp).</li>
        <li>Contratos pendentes: em queda em Azure e Engenharia de Dados; estagnado em MBA Direito pela terceira semana seguida (23 → 23 → 23) e em IA Negócios (74 → 74).</li>
        <li>CSAT: leve alta no geral (4,38 → 4,39); melhora em IA Negócios (+0,02) e Engenharia de Dados (+0,01); leve piora em MBA Direito (-0,01), segunda semana seguida em queda.</li>
        <li>Alunos em risco (estimativa): aumento líquido de 16 alunos (481 → 497), concentrado em Engenharia de Dados (+9).</li>
      </ul>
    </div>
  `;

  destroyChart('chartEvolAtivos');
  charts['chartEvolAtivos'] = new Chart(document.getElementById('chartEvolAtivos'), {
    type:'line',
    data:{ labels: DATA.semanas,
      datasets: DATA.cursos.map(c=>({ label:c.name.length>18?c.name.slice(0,18)+'…':c.name, borderColor:c.color, backgroundColor:c.color,
        data: wKeys.map(k=>c.semanas[k].base.ativos), tension:.3 })) },
    options:{ scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'#2a3a52'}}, y:{ticks:{color:'#94a3b8'},grid:{color:'#2a3a52'}}},
      plugins:{legend:{labels:{color:'#e2e8f0',font:{size:10}}}} }
  });

  destroyChart('chartEvolCsat');
  charts['chartEvolCsat'] = new Chart(document.getElementById('chartEvolCsat'), {
    type:'line',
    data:{ labels: DATA.semanas,
      datasets: DATA.cursos.map(c=>({ label:c.name.length>18?c.name.slice(0,18)+'…':c.name, borderColor:c.color, backgroundColor:c.color,
        data: wKeys.map(k=>c.semanas[k].csat.csat_curso), tension:.3 })) },
    options:{ scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'#2a3a52'}}, y:{min:3.5,max:5,ticks:{color:'#94a3b8'},grid:{color:'#2a3a52'}}},
      plugins:{legend:{labels:{color:'#e2e8f0',font:{size:10}}}} }
  });
}

  el.innerHTML = `
    <h2>Customer Success</h2>
    <div class="note">Metodologia de identificação de risco descrita ao final da página.</div>

      <table>
        <thead><tr><th>#</th><th>Aluno</th><th>Curso</th><th>Turma</th><th>Nível de risco</th><th>Motivo do risco</th><th>Ação recomendada</th></tr></thead>
        <tbody>
          ${top.map((s,i)=>{
            let nivel, nivelClass;
            if(s.score>=200){ nivel='Alto'; nivelClass='alto'; }

            else { nivel='Baixo'; nivelClass='baixo'; }

            return `<tr>
              <td>${i+1}</td><td>${s.nome}</td><td>${s.curso}</td><td>${s.turma}</td>
              <td><span class="badge ${nivelClass}">${nivel}</span></td>
              <td style="font-size:12px;">${s.motivos.join(' · ')}</td>
              <td style="font-size:12px;">${acao}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div class="note">Total de alunos em risco identificados no portfólio (semana ${weekLabel(wLatest)}, estimativa): <b>${DATA.alunos_risco_total[wLatest]}</b> de ${DATA.geral[wLatest].ativos} ativos (${pct(+(DATA.alunos_risco_total[wLatest]/DATA.geral[wLatest].ativos*100).toFixed(1))}). Tabela acima mostra os 20 de maior severidade; lista completa por curso disponível na aba "Por Pós-Graduação".</div>

        <tbody>
          ${DATA.preconfirmados[wLatest].filter(p=>p.status_contrato==='Pendente').slice(0,60).map(p=>`
            <tr><td>${p.nome}</td><td>${p.curso}</td><td>${p.turma}</td><td><span class="badge pendente">Pendente</span></td></tr>
          `).join('')}
        </tbody>
      </table>
      <div class="note">Mostrando até 60 registros de ${DATA.preconfirmados[wLatest].filter(p=>p.status_contrato==='Pendente').length} pré-confirmados com contrato pendente no total.</div>
    </div>

    <h3>Resumo de pré-confirmados por curso</h3>
    <div class="grid">
      ${DATA.cursos.map(c=>{ const b=c.semanas[wLatest].base; return `
        <div class="card" style="border-left:3px solid ${c.color};">
          <div class="label" style="color:var(--text);font-weight:700;">${c.name}</div>
          <div style="font-size:12.5px;margin-top:6px;">Aceito: <b>${b.pre_confirmado_aceito}</b> &nbsp;|&nbsp; Pendente: <b>${b.pre_confirmado_pendente}</b></div>
        </div>`; }).join('')}

      <b>Metodologia</b><br>
